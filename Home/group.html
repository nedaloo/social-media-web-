<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hive - Groups</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="group.css" />
</head>
<body>
  <header class="topbar">
    <div class="nav-left">
      <a class="brand" href="index.html" aria-label="Hive home" title="Hive home page">
        <i class="bi bi-hexagon hive-icon logo-icon"></i>
        <span class="logo-text">Hive</span>
      </a>
    </div>

    <nav class="main-nav" aria-label="Main navigation">
      <a class="nav-item" href="index.html" aria-label="Chats" title="Chats">
        <i class="bi bi-chat-left-text"></i>
        <span class="count" id="chats-unread-count">0</span>
      </a>
      <a class="nav-item-active" href="group.html" aria-label="Groups" title="Group chats" aria-current="page">
        <i class="bi bi-people"></i>
        <span class="count" id="groups-unread-count">0</span>
      </a>
    </nav>

    <div class="top-actions">
      <button class="avatar" type="button" aria-label="Profile" onclick="openProfile()">
        <img src="../prof/blank-profile-pic.png" alt="Profile" />
      </button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-heading">
        <div>
          <h1>Groups</h1>
          <p id="group-count">0 active groups</p>
        </div>
        <button class="add" type="button" aria-label="New group" onclick="newGroup()">+</button>
      </div>

      <div class="chat-list" aria-live="polite"><p>Loading groups...</p></div>
    </aside>

    <section class="conversation" aria-label="Group conversation">
      <div class="messages"></div>

    </section>
  </div>
  <script src="group.js"></script>
  <script src="realtime.js"></script>
  <script src="./net-speed.js"></script>
</body>
</html>
