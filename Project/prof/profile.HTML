<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive - Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <i class="bi bi-hexagon logo-icon"></i>
            <span class="logo-text" href="../Home/index.html" aria-label="Hive home" title="Hive home page">Hive</span>
        </div>

        <div class="nav-center">
            <i class="bi bi-chat-left-text nav-icon active" onclick="openchat()"></i>
            <i class="bi bi-people nav-icon" onclick="opengroup()"></i>
        </div>

        <div class="nav-right">
            <a href="../log in/index .html" class="logout-link">Log out</a>
            <div class="nav-avatar-box">
                <button class="nav-avatar" title="Profile"><img class="nav-avatar" src="Uruma.png" alt="Uruma" width="36px" height="36px"></button>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="profile-card">
            <div class="profile-left">
                <div class="avatar-wrapper">
                    <img src="Uruma.png" alt="Uruma" class="profile-avatar">
                    <span class="edit-avatar-badge">
                        <i class="bi bi-pencil"></i>
                    </span>
                </div>

                <div class="profile-info">
                    <h1 class="profile-name">Uruma</h1>
                    <p class="profile-handle">@urumasolo5</p>
                    <p class="profile-stats"><span>3</span> Friends</p>
                </div>
            </div>

          <button class="edit-profile-btn" type="button" onclick="editProfile()">Edit Profile</button>
        </section>

        <section class="friends-card">
            <h3 class="card-title">Friends</h3>

            <div class="friend-item">
                <img class="avatar" src="blank-profile-pic.png" alt="user-picture">
                <div>
                    <p class="friend-name">ahmed magdy</p>
                    <p class="friend-handle">@hamado000</p>
                </div>
            </div>

            <div class="friend-item">
                <img class="avatar" src="blank-profile-pic.png" alt="user-picture">
                <div>
                    <p class="friend-name">mahmoud</p>
                    <p class="friend-handle">@mahmoud</p>
                </div>
            </div>

            <div class="friend-item">
                <img src="blank-profile-pic.png" alt="Nedal Tarek" class="avatar">
                <div>
                    <p class="friend-name">Nedal Tarek</p>
                    <p class="friend-handle">@nedal.m.tarek</p>
                </div>
            </div>
        </section>
    </main>
<script src="./profile.js"></script>
<script src="../Home/net-speed.js"></script>
</body>
</html>
