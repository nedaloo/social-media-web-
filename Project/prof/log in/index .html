<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Hive - Login</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body>

    <div class="page-container">

        <!-- Logo -->
        <div class="logo-section">
            <div class="logo-icon">
                <div class="logo"><img src="Hive-logo.svg" width="30" height="30"></div>
                <b class="logo-text">Hive</b>
            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card">

            <p class="tagline"><b>A CALMER PLACE TO CONNECT</b></p>
            <h1 class="welcome-title"><b>Welcome back</b></h1>
            <p class="subtitle">Log in with your permanent username and password.</p>

            <!-- Login Form -->
            <form>
                <p class="form-label"><b>Username</b></p>
                <input class="form-input" type="text" placeholder="Your username">

                <p class="form-label"><b>Password</b></p>
                <input class="form-input" type="password" placeholder="Your password">

                <button class="login-btn" type="submit"><b>Log In</b></button>
            </form>

            <!-- Sign Up -->
            <div class="signup-section">
                <span class="signup-text">New to Hive? </span>
                <a class="signup-link" href="../sign%20up/sign%20.html"><b>Create an account</b></a>
            </div>

        </div>

    </div>

</body>
</html>
