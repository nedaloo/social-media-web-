<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Hive - Contacts &amp; Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="contacts.css">
</head>
<body>
  <header class="topbar">
    <a class="nav-left brand-link" href="Home.html" aria-label="Hive home" title="Hive home page">
      <i class="bi bi-hexagon logo-icon"></i><span class="logo-text">Hive</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a class="bi bi-chat-left-text nav-item" href="Home.html" aria-label="Messages" title="Chats"><span class="count">3</span></a>
      <a class="bi bi-people nav-item-active" href="contacts.html" aria-label="People" title="Group chats"></a>
    </nav>
    <div class="top-actions"><a class="avatar" href="Ahmed' work (main)/Profile.HTML" aria-label="Open profile" title="Profile"><img src="blank-profile-pic.png" alt="User profile" width="36" height="36"></a></div>
  </header>

  <main class="contacts-shell">
    <section class="contacts-card" aria-labelledby="contacts-title">
      <div class="contacts-heading">
        <div>
          <h1 id="contacts-title">Contacts &amp; Groups</h1>
          <p>Find people and manage your friend requests.</p>
        </div>
        <button class="create-group-button" type="button" aria-label="Create a group" title="Create a group" aria-controls="group-modal" aria-expanded="false">+</button>
      </div>

      <div class="contact-list">
        <article class="contact-row">
          <div class="initial-avatar" aria-hidden="true">a</div>
          <div class="contact-info"><strong>ahmed magdy</strong><span>@hamado000</span></div>
          <button class="message-button" type="button">Message</button>
        </article>
        <article class="contact-row">
          <div class="initial-avatar" aria-hidden="true">m</div>
          <div class="contact-info"><strong>mahmoud</strong><span>@mahmoud</span></div>
          <button class="message-button" type="button">Message</button>
        </article>
        <article class="contact-row">
          <img class="contact-avatar" src="blank-profile-pic.png" alt="Nedal Tarek">
          <div class="contact-info"><strong>Nedal Tarek</strong><span>@nedal.m.tarek</span></div>
          <button class="message-button" type="button">Message</button>
        </article>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="group-modal" hidden>
    <section class="group-modal" role="dialog" aria-modal="true" aria-labelledby="group-modal-title">
      <button class="close-modal" type="button" aria-label="Close create group dialog">×</button>
      <h2 id="group-modal-title">Create a group</h2>
      <form id="create-group-form">
        <label for="group-name">Group name</label>
        <input id="group-name" name="group-name" type="text" autocomplete="off" autofocus>
        <label for="friend-search">Add friends</label>
        <input id="friend-search" class="friend-search" type="search" placeholder="Type a friend's name..." autocomplete="off">
        <div class="friend-list">
          <label class="friend-option"><input type="checkbox" name="friends" value="ahmed"><span class="initial-avatar">a</span><span class="friend-details"><strong>ahmed magdy</strong><small>@hamado000</small></span></label>
          <label class="friend-option"><input type="checkbox" name="friends" value="mahmoud"><span class="initial-avatar">m</span><span class="friend-details"><strong>mahmoud</strong><small>@mahmoud</small></span></label>
          <label class="friend-option"><input type="checkbox" name="friends" value="nedal"><img class="contact-avatar" src="blank-profile-pic.png" alt=""><span class="friend-details"><strong>Nedal Tarek</strong><small>@nedal.m.tarek</small></span></label>
        </div>
        <button class="submit-group" type="submit">Create group</button>
      </form>
    </section>
  </div>
  <script>
    const modal = document.querySelector('#group-modal');
    const openButton = document.querySelector('.create-group-button');
    const closeButton = document.querySelector('.close-modal');
    const groupForm = document.querySelector('#create-group-form');
    const friendSearch = document.querySelector('#friend-search');

    function setModal(open) {
      modal.hidden = !open;
      openButton.setAttribute('aria-expanded', String(open));
      document.body.classList.toggle('modal-open', open);
      if (open) document.querySelector('#group-name').focus();
    }

    openButton.addEventListener('click', () => setModal(true));
    closeButton.addEventListener('click', () => setModal(false));
    modal.addEventListener('click', event => { if (event.target === modal) setModal(false); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && !modal.hidden) setModal(false); });
    groupForm.addEventListener('submit', event => { event.preventDefault(); setModal(false); });
    friendSearch.addEventListener('input', event => {
      const query = event.target.value.toLowerCase();
      document.querySelectorAll('.friend-option').forEach(friend => {
        friend.hidden = !friend.textContent.toLowerCase().includes(query);
      });
    });
  </script>
</body>
</html>
