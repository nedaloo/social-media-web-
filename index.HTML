<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive - Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <i class="bi bi-hexagon logo-icon"></i>
            <span class="logo-text">Hive</span>
        </div>

        <div class="nav-center">
            <i class="bi bi-chat-left-text nav-icon active"></i>
            <i class="bi bi-people nav-icon"></i>
        </div>

        <div class="nav-right">
            <a href="#" class="logout-link">Log out</a>
            <div class="nav-avatar-box">
                <img src="avatar.png" alt="Uruma" class="nav-avatar">
                <span class="online-dot small"></span>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="profile-card">
            <div class="profile-left">
                <div class="avatar-wrapper">
                    <img src="Uruma.png" alt="Uruma" class="profile-avatar">
                    <span class="edit-avatar-badge">
                        <i class="bi bi-pencil"></i>
                    </span>
                    <span class="online-dot"></span>
                </div>

                <div class="profile-info">
                    <h1 class="profile-name">Uruma</h1>
                    <p class="profile-handle">@urumasolo5</p>
                    <p class="profile-stats"><span>3</span> Friends</p>
                </div>
            </div>

            <button class="edit-profile-btn">Edit Profile</button>
        </section>

        <section class="friends-card">
            <h3 class="card-title">Friends</h3>

            <div class="friend-item">
                <div class="letter-avatar">a</div>
                <div>
                    <p class="friend-name">ahmed magdy</p>
                    <p class="friend-handle">@hamado000</p>
                </div>
            </div>

            <div class="friend-item">
                <div class="letter-avatar">m</div>
                <div>
                    <p class="friend-name">mahmoud</p>
                    <p class="friend-handle">@mahmoud</p>
                </div>
            </div>

            <div class="friend-item">
                <img src="nedal.png" alt="Nedal Tarek" class="friend-avatar">
                <div>
                    <p class="friend-name">Nedal Tarek</p>
                    <p class="friend-handle">@nedal.m.tarek</p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
